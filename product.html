<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Agastyaveda | Product</title><link rel="stylesheet" href="styles.css" /></head>
<body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/"><span class="brand-mark">✦</span><span><strong>agastyaveda</strong><small>AYURVEDIC WELLNESS</small></span></a><div class="nav-actions"><a class="text-link" href="/checkout.html">Bag <span id="product-cart-count">0</span></a><span data-auth-guest><a class="button button-small" href="/auth.html">Sign In</a> <a class="button button-small button-outline" href="/auth.html">Sign Up</a></span><span data-auth-user hidden><a class="button button-small" href="/patient.html"><img data-auth-avatar alt="" hidden /><span data-auth-name>My account</span><small data-auth-email></small></a> <button class="button button-small button-outline" type="button" data-auth-sign-out>Sign Out</button></span></div></div></header><script defer src="auth-ui.js"></script><main class="product-detail-page container"><a href="/#shop" class="text-link">← Back to shop</a><div id="product-detail" class="product-detail"></div><section class="recommendations"><p class="eyebrow">You may also like</p><h2>Complete your <em>ritual.</em></h2><div id="recommendation-grid" class="product-grid"></div></section></main><script>
const money=value=>`₹${Number(value).toLocaleString("en-IN")}`,escapeHtml=value=>String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));const params=new URLSearchParams(location.search);const id=params.get("id")||params.get("name");const cart=JSON.parse(localStorage.getItem("agastyaveda-cart")||"[]");document.querySelector("#product-cart-count").textContent=cart.length;
async function load(){const response=await fetch(`/api/products/${encodeURIComponent(id||"")}`);const data=await response.json();if(!response.ok)throw new Error(data.error);const p=data.product;document.title=`Agastyaveda | ${p.name}`;const image=p.imageUrl?`<div class="detail-art has-product-image" style="background-image:url('${escapeHtml(p.imageUrl)}')" aria-label="${escapeHtml(p.name)}"></div>`:`<div class="detail-art ${escapeHtml(p.category)}"><span>AGASTYAVEDA</span><b>${escapeHtml(p.name).toUpperCase()}</b></div>`;document.querySelector("#product-detail").innerHTML=`${image}<div class="detail-copy"><p class="eyebrow">From our apothecary</p><h1>${escapeHtml(p.name)}</h1><p class="detail-description">${escapeHtml(p.description)}</p><strong class="detail-price">${money(p.price)}</strong><p class="detail-stock">${escapeHtml(`${p.packageSize||""} ${p.packageUnit||""} · ${p.stock} available`) } · Small-batch preparation</p><button id="add-product" class="button">Add to bag <span>+</span></button><p class="detail-note">Thoughtfully made to support simple, everyday wellness rituals. For personal guidance, speak with Dr. Ankita during a consultation.</p></div>`;document.querySelector("#add-product").onclick=()=>{cart.push({name:p.name,price:p.price,productId:p._id,quantity:1});localStorage.setItem("agastyaveda-cart",JSON.stringify(cart));document.querySelector("#product-cart-count").textContent=cart.length;document.querySelector("#add-product").textContent="Added to bag ✓"};document.querySelector("#recommendation-grid").innerHTML=data.recommendations.map(item=>`<a class="product-card product-link" href="/product.html?id=${encodeURIComponent(item._id)}"><div class="product-image ${escapeHtml(item.category)} ${item.imageUrl?"has-product-image":""}" style="${item.imageUrl?`background-image:url('${escapeHtml(item.imageUrl)}')`:""}"><span style="${item.imageUrl?"display:none":""}">AGASTYAVEDA</span><b style="${item.imageUrl?"display:none":""}">${escapeHtml(item.name).toUpperCase()}</b></div><div class="product-info"><div><h3>${escapeHtml(item.name)}</h3><p>${escapeHtml(item.description)}</p></div><strong>${money(item.price)}</strong><small class="product-pack">${escapeHtml(`${item.packageSize||""} ${item.packageUnit||""}`)}</small></div></a>`).join("")}load().catch(error=>document.querySelector("#product-detail").innerHTML=`<p class="portal-status">${escapeHtml(error.message)}</p>`);
</script></body></html>
