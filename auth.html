<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Agastyaveda | Sign in</title><link rel="stylesheet" href="styles.css" /></head>
<body class="portal-body"><main class="auth-page"><a class="brand" href="/"><span class="brand-mark">✦</span><span><strong>agastyaveda</strong><small>AYURVEDIC WELLNESS</small></span></a><section class="auth-card"><p class="eyebrow">Your wellness space</p><h1>Come as you are.</h1><p>Patients can manage appointments and orders here securely.</p><div class="auth-buttons"><button id="sign-in" class="button">Patient sign in <span>↗</span></button><button id="sign-up" class="button button-outline">Patient sign up <span>↗</span></button></div><p id="auth-status" class="portal-status"></p></section></main><script>
async function boot(){const config=await(await fetch("/api/config")).json();if(!config.clerkEnabled){document.querySelector("#auth-status").textContent="Authentication is currently in local preview mode. Set both Clerk keys to enable accounts.";return}const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js";script.async=true;script.crossOrigin="anonymous";script.setAttribute("data-clerk-publishable-key",config.clerkPublishableKey);await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=()=>reject(new Error("Clerk failed to load."));document.head.appendChild(script)});await window.Clerk.load();document.querySelector("#sign-in").onclick=()=>window.Clerk.redirectToSignIn({afterSignInUrl:"/patient.html"});document.querySelector("#sign-up").onclick=()=>window.Clerk.redirectToSignUp({afterSignUpUrl:"/patient.html"})}boot().catch(error=>document.querySelector("#auth-status").textContent=error.message);
</script></body></html>
